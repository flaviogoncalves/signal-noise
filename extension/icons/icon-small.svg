<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The toolbar size, drawn on the pixel grid so the bars stay crisp at 16px. -->
  <rect width="16" height="16" rx="3" fill="#0f172a"/>
  <g fill="#64748b">
    <rect x="1" y="6" width="2" height="4"/>
    <rect x="4" y="5" width="2" height="6"/>
    <rect x="10" y="5" width="2" height="6"/>
    <rect x="13" y="6" width="2" height="4"/>
  </g>
  <rect x="7" y="2" width="2" height="12" fill="#34d399"/>
</svg>
